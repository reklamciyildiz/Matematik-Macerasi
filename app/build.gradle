plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.9.0'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.yigit033.matematikmacarasi'
    compileSdk 36

    defaultConfig {
        applicationId "com.yigit033.matematikmacarasi"
        minSdk 24
        targetSdk 36
        versionCode 15
        versionName "1.3.0"

        // Intentionally disabled until Cloudflare D1 is provisioned, legacy
        // rights have been migrated, and real-device acceptance tests pass.
        def cloudflareEnabled = (project.findProperty('MM_USE_CLOUDFLARE') ?: 'false').toString() == 'true'
        def cloudflareUrl = (project.findProperty('MM_CLOUDFLARE_URL') ?: '').toString()
        def cloudflarePublicKey = (project.findProperty('MM_CLOUDFLARE_PUBLIC_KEY_B64') ?: '').toString()
        if (cloudflareEnabled && (!cloudflareUrl.matches('https://[A-Za-z0-9.-]+(/[A-Za-z0-9/_-]*)?') ||
                !cloudflarePublicKey.matches('[A-Za-z0-9+/=]{200,}'))) {
            throw new GradleException('Cloudflare mode requires a valid HTTPS URL and public RSA key.')
        }
        // Disabled until Play subscription base plans and expiry verification pass QA.
        def subscriptionsEnabled = (project.findProperty('MM_SUBSCRIPTIONS_ENABLED') ?: 'false').toString() == 'true'
        def playSubsUrl = (project.findProperty('MM_PLAY_SUBS_URL') ?: '').toString()
        def playPub = (project.findProperty('MM_PLAY_SUBS_PUBLIC_KEY_B64') ?: '').toString()
        def playProject = (project.findProperty('MM_PLAY_INTEGRITY_PROJECT_NUMBER') ?: '').toString()
        if(subscriptionsEnabled && (!playSubsUrl.matches('https://[A-Za-z0-9.-]+(/[A-Za-z0-9/_-]*)?') ||
                !playPub.matches('[A-Za-z0-9+/=]{200,}') ||
                !playProject.matches('[0-9]{4,20}'))) {
            throw new GradleException('Subscriptions require verified Play Worker URL, separate RSA public key and Play Integrity cloud project number.')
        }
        buildConfigField 'String', 'MM_PLAY_SUBS_URL', '"' + playSubsUrl + '"'
        buildConfigField 'String', 'MM_PLAY_SUBS_PUBLIC_KEY_B64', '"' + playPub + '"'
        buildConfigField 'String', 'MM_PLAY_INTEGRITY_PROJECT_NUMBER', '"' + playProject + '"'
        buildConfigField 'boolean', 'MM_SUBSCRIPTIONS_ENABLED', subscriptionsEnabled.toString()
        buildConfigField 'boolean', 'MM_USE_CLOUDFLARE', cloudflareEnabled.toString()
        buildConfigField 'String', 'MM_CLOUDFLARE_URL', '"' + cloudflareUrl + '"'
        buildConfigField 'String', 'MM_CLOUDFLARE_PUBLIC_KEY_B64', '"' + cloudflarePublicKey + '"'


        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            storeFile file("matematik_macerasi.keystore")
            storePassword project.properties['KEYSTORE_PASSWORD']
            keyAlias "matematik_macerasi"
            keyPassword project.properties['KEY_PASSWORD']
        }
    }

    buildTypes {
        release {
            // R8 is opt-in for a QA build; production defaults to the known
            // stable path until minified games/Billing/code restore pass tests.
            def r8Qa = (project.findProperty('MM_R8_RELEASE_ENABLED') ?: 'false')
                .toString() == 'true'
            minifyEnabled r8Qa
            shrinkResources r8Qa
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
        // CI-only-style minified QA variant: debug signing, original package.
        // NEVER upload this APK to Play; it is not a release artifact.
        r8Qa {
            initWith release
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            matchingFallbacks = ['release']
            versionNameSuffix '-r8qa'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

// A Play release MUST use the same signed-license backend as the already
// activated code users. A local debug build may use legacy Firebase for QA;
// neither configuration is silently promoted to the published AAB.
gradle.taskGraph.whenReady { graph ->
    boolean releasing = graph.allTasks.any { t ->
        t.project == project && t.name in ['bundleRelease', 'assembleRelease']
    }
    if (releasing) {
        def releaseMode = (project.findProperty('MM_RELEASE_PREMIUM_MODE') ?: '').toString()
        def codeEnabled = (project.findProperty('MM_USE_CLOUDFLARE') ?: 'false').toString() == 'true'
        def subscriptionsEnabled = (project.findProperty('MM_SUBSCRIPTIONS_ENABLED') ?: 'false').toString() == 'true'
        if (releaseMode != 'cloudflare' || !codeEnabled) {
            throw new GradleException(
                'Release blocked: MM_RELEASE_PREMIUM_MODE=cloudflare AND ' +
                'MM_USE_CLOUDFLARE=true are required. ' +
                'Import legacy D1 activations and verify signed-license renewal first.')
        }
        if (subscriptionsEnabled) {
            throw new GradleException(
                'Release blocked: monthly/yearly sales require verified Play Developer API ' +
                'and RTDN entitlement backend. Keep MM_SUBSCRIPTIONS_ENABLED=false.')
        }
        if (!(project.findProperty('MM_LEGACY_CODE_IMPORT_QA_COMPLETE') ?: 'false')
                .toString().equalsIgnoreCase('true')) {
            throw new GradleException(
                'Release blocked: finish legacy Firebase->D1 code import and user restore QA; ' +
                'then set MM_LEGACY_CODE_IMPORT_QA_COMPLETE=true in local gradle.properties.')
        }
        if (!file('matematik_macerasi.keystore').isFile() ||
                !(project.findProperty('KEYSTORE_PASSWORD') ?: '').toString().trim() ||
                !(project.findProperty('KEY_PASSWORD') ?: '').toString().trim()) {
            throw new GradleException(
                'Release blocked: upload keystore or signing passwords are missing. ' +
                'Use local app/matematik_macerasi.keystore; never commit secrets.')
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.material3:material3-window-size-class'

    // SplashScreen API için gerekli kütüphane
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // ConstraintLayout for Compose
    implementation 'androidx.constraintlayout:constraintlayout-compose:1.0.1'

    // Coil kütüphanesi - Görüntü yükleme için
    implementation 'io.coil-kt:coil-compose:2.4.0'

    // Lottie kütüphanesi - Animasyonlu avatarlar için
    implementation 'com.airbnb.android:lottie-compose:6.1.0'

    // Media3 için bağımlılıklar
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    implementation 'androidx.media3:media3-common:1.2.1'

    // Gson için bağımlılık
    implementation 'com.google.code.gson:gson:2.10.1'

    // Google Fonts için bağımlılık
    implementation 'androidx.compose.ui:ui-text-google-fonts'

    // Supabase REST API için bağımlılıklar
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter:0.8.0'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'

    // Serialization için bağımlılık
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.3.3'

    // Google Play Billing Kütüphanesi
    implementation 'com.android.billingclient:billing-ktx:8.0.0'
    implementation 'com.google.android.play:integrity:1.5.0'

    // Google AdMob Kütüphanesi
    implementation 'com.google.android.gms:play-services-ads:22.4.0'

    // Google Play App Update - Android 14 uyumlu In-App Updates
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.play:app-update-ktx:2.1.0'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-database-ktx'
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.02.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}