name = "matematik-macerasi-premium"
main = "src/index.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

# Cloudflare D1 database created in the owner's Free account.
[[d1_databases]]
binding = "DB"
database_name = "matematik-macerasi-premium"
database_id = "278757f5-3ff1-490e-854d-d7eb6898f296"
migrations_dir = "migrations"

# Approximate, per-Cloudflare-datacenter abuse protection; not an identity proof.
[[ratelimits]]
name = "REDEEM_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "RENEW_LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 120
  period = 60
