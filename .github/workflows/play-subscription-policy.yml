name: Play subscription entitlement policy tests

on:
  push:
    branches: [main]
    paths:
      - "commercial/play-subscriptions/**"
      - ".github/workflows/play-subscription-policy.yml"
  pull_request:
    paths:
      - "commercial/play-subscriptions/**"
      - ".github/workflows/play-subscription-policy.yml"

permissions:
  contents: read

jobs:
  server-policy-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commercial/play-subscriptions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check subscription server syntax
        run: |
          node --check src/entitlement.mjs
          node --check src/google-play-verifier.mjs
          node --check src/play-integrity.mjs
          node --check src/worker.mjs
      - name: Subscription state and Google API mock integration tests
        run: npm test
      - name: Check subscription key generator and existing-key recovery syntax
        run: |
          node --check scripts/generate-play-lease-key.mjs
          node --check scripts/derive-existing-play-public-key.mjs
          node --check scripts/repair-android-play-public-key.mjs
      - name: Check Google Cloud Shell bootstrap syntax
        run: bash -n scripts/create-google-pubsub.sh
      - name: Validate PowerShell bootstrap syntax without deploying
        working-directory: .
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($path in @("commercial/play-subscriptions/scripts/setup-staging.ps1", "commercial/play-subscriptions/scripts/configure-rtdn.ps1", "commercial/play-subscriptions/scripts/enable-internal-play-qa.ps1", "commercial/play-subscriptions/scripts/deploy-acknowledgement-recovery.ps1", "commercial/play-subscriptions/scripts/repair-android-play-public-key.ps1")) {
            $errors = $null
            $tokens = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -ne 0) { $errors | Format-List; exit 1 }
          }
