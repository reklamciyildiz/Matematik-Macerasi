name: Build Licensed Turkish HD Narration Pack

# Manual, build-time-only paid synthesis. No Android runtime cloud keys.
on:
  workflow_dispatch:
    inputs:
      voice:
        description: 'Turkish Google Cloud Chirp 3 HD voice'
        type: choice
        required: true
        default: tr-TR-Chirp3-HD-Kore
        options:
          - tr-TR-Chirp3-HD-Kore
          - tr-TR-Chirp3-HD-Aoede
          - tr-TR-Chirp3-HD-Leda
          - tr-TR-Chirp3-HD-Charon
      audition_only:
        description: 'Generate 12 clips first to check sound by ear'
        type: boolean
        default: true

jobs:
  voice-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK 36
        shell: bash
        run: |
          SDK_MANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDK_MANAGER" ] || [ ! -x "$SDK_MANAGER" ]; then
            echo "::error::Android command-line SDK manager missing"
            exit 1
          fi
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure safe compile-only environment
        shell: bash
        run: |
          echo 'android.useAndroidX=true' >> gradle.properties
          echo 'android.enableJetifier=true' >> gradle.properties
          echo 'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' >> gradle.properties
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = {
              "project_info": {
                  "project_number": "123456789012",
                  "project_id": "matematik-macerasi-ci",
                  "firebase_url": "https://matematik-macerasi-ci-default-rtdb.firebaseio.com"
              },
              "client": [{
                  "client_info": {
                      "mobilesdk_app_id": "1:123456789012:android:1234567890abcdef12345678",
                      "android_client_info": {"package_name": "com.yigit033.matematikmacarasi"}
                  },
                  "api_key": [{"current_key": "CI_ONLY_INVALID_API_KEY_NOT_FOR_PRODUCTION"}]
              }],
              "configuration_version": "1"
          }
          Path("app/google-services.json").write_text(json.dumps(data), "utf-8")
          PY
      - name: Generate grade 1–8 authored teaching narration manifest
        shell: bash
        env:
          MM_NARRATION_EXPORT: '1'
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --tests 'com.yigit033.matematikmacarasi.learning.LessonVoiceManifestTest' --no-daemon
          test -s app/build/narration/manifest.tsv
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare cloud TTS client library
        run: python -m pip install 'google-cloud-texttospeech>=2.20,<3'
      - name: Synthesize licensed, cacheable Turkish HD MP3 clips
        shell: bash
        env:
          GOOGLE_TTS_CREDENTIAL_B64: ${{ secrets.MM_NARRATION_TTS_SERVICE_ACCOUNT_B64 }}
          MM_VOICE: ${{ inputs.voice }}
          AUDITION_ONLY: ${{ inputs.audition_only }}
        run: |
          if [ -z "$GOOGLE_TTS_CREDENTIAL_B64" ]; then
            echo "::error::Set MM_NARRATION_TTS_SERVICE_ACCOUNT_B64 in GitHub Actions secrets first"
            exit 1
          fi
          credential="$RUNNER_TEMP/voice-account.json"
          trap 'rm -f "$credential"' EXIT
          printf '%s' "$GOOGLE_TTS_CREDENTIAL_B64" | base64 -d > "$credential"
          chmod 600 "$credential"
          export GOOGLE_APPLICATION_CREDENTIALS="$credential"
          LIMIT=""
          if [ "$AUDITION_ONLY" = "true" ]; then LIMIT="--limit 12"; fi
          python tools/narration/synthesize_chirp3.py             --manifest app/build/narration/manifest.tsv             --voice "$MM_VOICE" $LIMIT
      - name: Upload reviewable OFFLINE voice pack (not auto-deployed)
        uses: actions/upload-artifact@v4
        with:
          name: turkish-hd-lesson-voice-${{ inputs.voice }}
          path: app/src/main/assets/lesson_narration/tr-TR/*.mp3
          if-no-files-found: error
          retention-days: 7
