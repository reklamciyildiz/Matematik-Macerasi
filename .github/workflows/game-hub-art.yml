name: Render Premium Game Hub Cards
on:
  push:
    branches: [main]
    paths:
      - scripts/generate_game_hub_art.py
      - .github/workflows/game-hub-art.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  create-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate WebP card illustrations
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.1.0
          python scripts/generate_game_hub_art.py
      - name: Verify generated assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          names=['number_hunt','addition','subtraction','multiplication','division','maze','forest']
          root=Path('app/src/main/res/drawable-nodpi')
          for name in names:
              p=root/f'card_{name}_premium.webp'
              assert p.exists()
              im=Image.open(p); im.load()
              assert im.format=='WEBP' and im.size==(600,620)
              assert 3000<p.stat().st_size<300000
              print(name,p.stat().st_size)
          PY
      - name: Commit cards to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable-nodpi/card_*_premium.webp
          if ! git diff --cached --quiet; then
            git commit -m "art(games): premium illustrated WebP covers for Number Hunt and operations"
            git push origin HEAD:main
          fi
