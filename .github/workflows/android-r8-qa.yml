name: Android R8 optimized QA build

on:
  push:
    branches: [main]
    paths:
      - "app/build.gradle"
      - "app/proguard-rules.pro"
      # Character gallery and animations must also survive minification.
      - "app/src/main/java/com/yigit033/matematikmacarasi/screens/AvatarStoreActivity.kt"
      - "app/src/main/java/com/yigit033/matematikmacarasi/components/Avatar*.kt"
      - "app/src/main/java/com/yigit033/matematikmacarasi/components/AnimatedAvatarView.kt"
      - "app/src/main/java/com/yigit033/matematikmacarasi/services/AvatarService.kt"
      - ".github/workflows/android-r8-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-r8-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android API 36
        shell: bash
        run: |
          SDK_MANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then SDK_MANAGER="$(command -v sdkmanager || true)"; fi
          if [ -z "$SDK_MANAGER" ] || [ ! -x "$SDK_MANAGER" ]; then exit 1; fi
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Compile-only Firebase config (NEVER deploy)
        shell: bash
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {"project_number":"123456789012","project_id":"ci-build-only","storage_bucket":"ci-build-only.appspot.com"},
            "client": [{"client_info":{"mobilesdk_app_id":"1:123456789012:android:0000000000000000","android_client_info":{"package_name":"com.yigit033.matematikmacarasi"}},"oauth_client":[],"api_key":[{"current_key":"CI_ONLY_NOT_VALID"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],
            "configuration_version":"1"
          }
          JSON
          # CI ONLY: non-functional/public placeholders ensure R8 keeps the
          # enabled Play SUBS and Cloudflare code paths in the optimized APK.
          # The resulting APK cannot verify a real purchase and MUST NOT ship.
          DUMMY_PUBLIC_RSA_B64="$(printf 'A%.0s' {1..360})"
          cat >> gradle.properties <<PROPS
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          kotlin.compiler.execution.strategy=in-process
          MM_USE_CLOUDFLARE=true
          MM_CLOUDFLARE_URL=https://r8qa.invalid
          MM_CLOUDFLARE_PUBLIC_KEY_B64=${DUMMY_PUBLIC_RSA_B64}
          MM_SUBSCRIPTIONS_ENABLED=true
          MM_PLAY_SUBS_URL=https://r8qa.invalid
          MM_PLAY_SUBS_PUBLIC_KEY_B64=${DUMMY_PUBLIC_RSA_B64}
          MM_PLAY_INTEGRITY_PROJECT_NUMBER=123456789012
          PROPS
      - name: Validate optimized local Play build script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/build-optimized-play-qa.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
      - name: Compile optimized QA variant (not publishable)
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleR8Qa
      - name: Validate mapping and prove code was actually renamed
        shell: bash
        run: |
          python3 scripts/check_r8_mapping.py app/build/outputs/mapping/r8Qa/mapping.txt
          echo "::notice::CI-only dummy backend keys and URLs. Not publishable. Mapping does not guarantee Play Console's 25 percent DEX metrics."
