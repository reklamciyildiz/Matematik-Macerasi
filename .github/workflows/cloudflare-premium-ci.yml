name: Cloudflare Premium API tests

on:
  push:
    branches:
      - main
      - feat/cloudflare-premium-license
    paths:
      - "commercial/cloudflare-premium/**"
      - ".github/workflows/cloudflare-premium-ci.yml"
  pull_request:
    paths:
      - "commercial/cloudflare-premium/**"
      - ".github/workflows/cloudflare-premium-ci.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commercial/cloudflare-premium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check scripts/smoke-live-import.mjs
      - run: node --test tests/*.test.mjs
