plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.9.0'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.yigit033.matematikmacarasi'
    compileSdk 36

    defaultConfig {
        applicationId "com.yigit033.matematikmacarasi"
        minSdk 24
        targetSdk 36
        versionCode 14
        versionName "1.2.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            storeFile file("matematik_macerasi.keystore")
            storePassword project.properties['KEYSTORE_PASSWORD']
            keyAlias "matematik_macerasi"
            keyPassword project.properties['KEY_PASSWORD']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.material3:material3-window-size-class'

    // SplashScreen API için gerekli kütüphane
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // ConstraintLayout for Compose
    implementation 'androidx.constraintlayout:constraintlayout-compose:1.0.1'

    // Coil kütüphanesi - Görüntü yükleme için
    implementation 'io.coil-kt:coil-compose:2.4.0'

    // Lottie kütüphanesi - Animasyonlu avatarlar için
    implementation 'com.airbnb.android:lottie-compose:6.1.0'

    // Media3 için bağımlılıklar
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    implementation 'androidx.media3:media3-common:1.2.1'

    // Gson için bağımlılık
    implementation 'com.google.code.gson:gson:2.10.1'

    // Google Fonts için bağımlılık
    implementation 'androidx.compose.ui:ui-text-google-fonts'

    // Supabase REST API için bağımlılıklar
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter:0.8.0'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'

    // Serialization için bağımlılık
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.3.3'

    // Google Play Billing Kütüphanesi
    implementation 'com.android.billingclient:billing-ktx:8.0.0'

    // Google AdMob Kütüphanesi
    implementation 'com.google.android.gms:play-services-ads:22.4.0'

    // Google Play App Update - Android 14 uyumlu In-App Updates
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.play:app-update-ktx:2.1.0'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-database-ktx'
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.02.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}